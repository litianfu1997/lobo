[project]
name = "lobo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "openai>=1.20",
  "httpx>=0.27",
  "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
markers = ["integration: 需要真实 DeepSeek API key 的集成测试"]
addopts = "-m 'not integration'"
testpaths = ["tests"]
